name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Test-only placeholders: lib/firebase.ts throws at startup when the Firebase
      # client config is missing, and CI has no real credentials. These values are
      # never used to talk to a live Firebase project.
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-test-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-test.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-test-project
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-test-project.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
      NEXT_PUBLIC_FIRESTORE_DATABASE_ID: ci-test-db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build